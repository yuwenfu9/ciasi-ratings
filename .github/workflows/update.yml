name: 自动更新中保研评级

on:
  schedule:
    # 每周日 北京时间 09:17 自动重抓（UTC 01:17）
    - cron: '17 1 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取最新评级
        run: python fetch_ciasi.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ciasi_ratings.json ciasi_ratings.csv
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新中保研 C-IASI 评级 $(date +%F)"
            git push
          fi
