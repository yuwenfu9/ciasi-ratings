name: 自动更新汽车安全测评数据

on:
  schedule:
    # 中保研按"批次"不规则发布（2025测评车型 11-28/01-21/03-26/05-28/08-27 共5批），无固定周历。
    # 改为每天轮询（北京时间 09:17 = UTC 01:17），数据有变才提交，任何一批出来 24h 内捕获。
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并合并（C-IASI + 中汽测评四体系 + 汽车之家指导价）
        run: python refresh_all.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ciasi_ratings.json ciasi_ratings.csv cncap_all.json prices.json ratings_all.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新测评数据 $(date +%F)"
            git push
          fi
